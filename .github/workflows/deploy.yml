name: Deploy AppVault to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Override Supabase configuration when repository variables are set
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Using the Supabase configuration committed in assets/js/config.js"
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          with open('assets/js/config.js', 'w') as config:
              config.write('// Generated during deployment from GitHub Actions repository variables.\n')
              config.write(f'export const SUPABASE_URL = {json.dumps(os.environ.get("SUPABASE_URL", ""))};\n')
              config.write(f'export const SUPABASE_PUBLISHABLE_KEY = {json.dumps(os.environ.get("SUPABASE_PUBLISHABLE_KEY", ""))};\n')
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
